<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<title>Tra Cứu Ống HDPE & uPVC - 2026</title>

<style>
:root{
    --primary:#0f766e;     /* xanh ngọc đậm */
    --primary-soft:#ccfbf1;
    --bg:#f5f7f8;
    --border:#d1d5db;
    --text:#1f2937;
}

*{ box-sizing:border-box; }

body{
    margin:0;
    min-height:100vh;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    background:var(--bg);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:16px;
    color:var(--text);
}

.container{
    width:100%;
    max-width:760px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 20px 20px;
}

/* ===== HEADER ===== */
.header{
    text-align:center;
    margin-bottom:10px;
}
.header h2{
    margin:0;
    font-size:20px;
    color:var(--primary);
}
.header .sub{
    font-size:14px;
    color:#555;
    margin-top:2px;
}

/* ===== SEARCH ===== */
.search-group{
    display:grid;
    grid-template-columns:140px 1fr auto;
    gap:10px;
    margin:14px 0 10px;
}

select,input{
    padding:10px 12px;
    font-size:14px;
    border:1px solid var(--border);
    border-radius:8px;
}

select:focus,input:focus{
    outline:none;
    border-color:var(--primary);
}

button{
    background:var(--primary);
    color:#fff;
    border:none;
    padding:10px 22px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}
button:hover{ opacity:.9; }

/* ===== STATUS ===== */
.count-info{
    font-size:13px;
    color:#475569;
    margin:8px 0 12px;
    font-style:italic;
}

.error{
    color:#991b1b;
    background:#fee2e2;
    border:1px solid #fecaca;
    padding:10px;
    border-radius:8px;
    font-size:14px;
    text-align:center;
}

/* ===== RESULT CARD ===== */
.result-card{
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:14px;
    background:#fafafa;
}

.result-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
}

.result-header strong{
    font-size:15px;
}

.std-badge{
    background:var(--primary-soft);
    color:var(--primary);
    padding:4px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
}

/* ===== TABLE ===== */
table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
}

thead th{
    text-align:left;
    font-weight:600;
    color:#374151;
    border-bottom:1px solid var(--border);
    padding:6px 4px;
}

tbody td{
    padding:6px 4px;
    border-bottom:1px dashed #e5e7eb;
}
</style>
</head>

/* ================= TRA CỨU ================= */
function lookupPipe() {
    const val = parseInt(document.getElementById('odInput').value);
    const type = document.getElementById('pipeType').value;
    const container = document.getElementById('resultsContainer');
    const status = document.getElementById('statusMsg');

    const pipeData = (type === "HDPE") ? pipeDataHDPE : pipeDataUPVC;
    const matches = pipeData.filter(p => p.OD_mm === val);

    container.innerHTML = '';

    if (matches.length > 0) {
        status.innerHTML = `<div class="count-info">
            Tìm thấy ${matches.length} tiêu chuẩn ${type} cho ống Ø${val}
        </div>`;

        matches.forEach(pipe => {
            let thicknessRows = '';
            Object.entries(pipe.thickness).forEach(([pn, t]) => {
                thicknessRows += `<tr><td>${pn}</td><td>${t} mm</td></tr>`;
            });

            container.innerHTML += `
            <div class="result-card">
                <div style="display:flex;justify-content:space-between;align-items:center">
                    <strong>Ø${pipe.OD_mm}${pipe.DKND_Inch ? " ("+pipe.DKND_Inch+")" : ""}</strong>
                    <span class="std-badge">${pipe.Standard}</span>
                </div>
                <table>
                    <thead><tr><th>Áp suất</th><th>Độ dày</th></tr></thead>
                    <tbody>${thicknessRows}</tbody>
                </table>
            </div>`;
        });
    } else {
        status.innerHTML = `<div class="error">
            Không tìm thấy thông số cho Ø${val}
        </div>`;
    }
}

// Enter để tìm
document.getElementById('odInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') lookupPipe();
});
