<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tra cứu lệnh QCAD đầy đủ</title>
    <style>
        body {
            font-family: Arial, sans-serif; 
            max-width: 1100px; 
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f8fafc;
        }
        h2 {
            color: #1e293b;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .search-wrapper {
            display: flex;
            gap: 25px;
        }
        .search-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .column-title {
            font-size: 15px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 8px;
        }
        input {
            width: 100%; 
            padding: 14px; 
            box-sizing: border-box; 
            font-size: 16px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        #searchKey:focus { border-color: #2563eb; }
        #searchName:focus { border-color: #0d9488; }
        .list-container {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-top: 5px;
            max-height: 320px;
            overflow-y: auto;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 10;
        }
        .item {
            padding: 11px 12px; 
            cursor: pointer; 
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .item:last-child { border-bottom: none; }
        .item:hover { background: #f1f5f9; }
        .item-key {
            font-weight: bold;
            color: #2563eb;
            background: #eff6ff;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 13px;
            white-space: nowrap;
        }
        .item-name {
            flex: 1;
            color: #334155;
            font-size: 14px;
        }
        .item-cat {
            font-size: 11px;
            color: #64748b;
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
        }
        #result {
            margin-top: 40px; 
            padding: 20px; 
            background: #eff6ff; 
            border-left: 5px solid #2563eb;
            border-radius: 4px;
            display: none;
        }
        #result p {
            margin: 8px 0;
            font-size: 16px;
            color: #334155;
        }
        .count {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<h2>Tra cứu nhanh lệnh QCAD</h2>
<div class="subtitle">Đầy đủ toàn bộ phím tắt từ bảng QCAD Shortcuts (3 trang)</div>

<div class="search-wrapper">
    <div class="search-column">
        <div class="column-title">🔍 TÌM THEO PHÍM TẮT (KEY ONLY):</div>
        <input id="searchKey" placeholder="Gõ phím tắt: li, po, mv, ctrl..." autocomplete="off">
        <div id="listKey" class="list-container"></div>
    </div>
    <div class="search-column">
        <div class="column-title">📝 TÌM THEO TÁC DỤNG (NAME ONLY):</div>
        <input id="searchName" placeholder="Gõ tác dụng: vẽ, đo, đường thẳng, xoay..." autocomplete="off">
        <div id="listName" class="list-container"></div>
    </div>
</div>

<div id="result"></div>
<div class="count" id="totalCount"></div>

const inputKey = document.getElementById('searchKey');
const inputName = document.getElementById('searchName');
const listKey = document.getElementById('listKey');
const listName = document.getElementById('listName');
const resultBox = document.getElementById('result');
const totalCount = document.getElementById('totalCount');

totalCount.textContent = `Tổng số lệnh đã nạp: ${commands.length}`;

function removeTones(str) {
  return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "d").toLowerCase();
}

function makeItemHTML(cmd) {
  return `<span class="item-key">${cmd.key}</span><span class="item-name">${cmd.name}</span><span class="item-cat">${cmd.category}</span>`;
}

function showDetail(cmd) {
  resultBox.innerHTML = `
    <h3>Thông tin chi tiết lệnh:</h3>
    <p><strong>Phím tắt (Key):</strong> <span style="color:#2563eb; font-weight:bold;">${cmd.key}</span></p>
    <p><strong>Tác dụng (Name):</strong> ${cmd.name}</p>
    <p><strong>Danh mục (Category):</strong> ${cmd.category}</p>
  `;
  resultBox.style.display = 'block';
}

inputKey.addEventListener('input', function() {
  const query = this.value.trim().toLowerCase();
  listKey.innerHTML = '';
  listName.innerHTML = '';
  if (!query) return;
  const filtered = commands.filter(cmd => cmd.key.toLowerCase().includes(query));
  filtered.forEach(cmd => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = makeItemHTML(cmd);
    div.addEventListener('click', function() {
      inputKey.value = cmd.key;
      inputName.value = '';
      listKey.innerHTML = '';
      showDetail(cmd);
    });
    listKey.appendChild(div);
  });
});

inputName.addEventListener('input', function() {
  const query = this.value.trim().toLowerCase();
  const queryNoTone = removeTones(query);
  listName.innerHTML = '';
  listKey.innerHTML = '';
  if (!query) return;
  const filtered = commands.filter(cmd => {
    const nameMatch = cmd.name.toLowerCase().includes(query);
    const nameNoToneMatch = removeTones(cmd.name).includes(queryNoTone);
    return nameMatch || nameNoToneMatch;
  });
  filtered.forEach(cmd => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = makeItemHTML(cmd);
    div.addEventListener('click', function() {
      inputName.value = cmd.name;
      inputKey.value = '';
      listName.innerHTML = '';
      showDetail(cmd);
    });
    listName.appendChild(div);
  });
});

document.addEventListener('click', function(e) {
  if (e.target !== inputKey && e.target !== inputName) {
    listKey.innerHTML = '';
    listName.innerHTML = '';
  }
});
</script>
